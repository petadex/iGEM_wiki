<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjacency Landscape</title>
<!--
  Interactive version of the adjacency figures (out/01..05). Same fields, same
  points, same camera as make_landscapes.py, which writes the data block below.
  Open landscape.html in a browser; it needs nothing from the network. The
  structure images are read from ../structures/.

  Keys:  right / space / page down  next panel
         left / page up              previous panel
         1-7                         jump to a panel (animated); 7 is panel 6 in dark mode
         p  play 1 -> 6    r  reset view    h  hide controls    f  fullscreen
  Drag to orbit, double-click to reset. #2 in the URL opens on panel 2.
-->
<style>
  :root {
    --ink: #0f172a; --ink2: #475569; --muted: #64748b; --hair: #cbd5e1; --surface: #f8fafc;
    --u: 1px;
    --card: #fff; --card2: #f8fafc; --under: #94a3b8; --shadow1: rgba(15,23,42,.08); --shadow2: rgba(15,23,42,.14);
    --link: #0d7f8c; --linkline: #b5dfe0; --info: #e2e8f0; --glass: rgba(255,255,255,.85); --chip: #f1f5f9;
    --lblbg: rgba(248,250,252,.88); --chipbg: #eef6f6; --chipfg: #0d6670; --hl: #eef2f6;
    --mark: #e74c4c;
  }
  /* dark mode (panel 7): a dark background with light foreground; the same
     tokens redefined, so every rule above follows */
  body.dark {
    --ink: #e6edf6; --ink2: #b4c0d0; --muted: #8a98ad; --hair: #2b3a52; --surface: #0b1220;
    --card: #131c2e; --card2: #18233a; --under: #5b6b84; --shadow1: rgba(0,0,0,.35); --shadow2: rgba(0,0,0,.55);
    --link: #5fd3cb; --linkline: #2d5f62; --info: #26344c; --glass: rgba(19,28,46,.88); --chip: #1f2b42;
    --lblbg: rgba(11,18,32,.85); --chipbg: #123236; --chipfg: #8de3dc; --hl: #1a2540;
    --mark: #ff7a7a;
  }
  html, body { transition: background-color .45s, color .45s; }
  body.dark .site img { filter: brightness(.9); }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage.dragging { cursor: grabbing; }
  #gl, #svg, #labels { position: absolute; inset: 0; width: 100%; height: 100%; }
  #svg, #labels { pointer-events: none; }

  .lbl { position: absolute; left: 0; top: 0; white-space: pre; line-height: 1.18;
    padding: calc(var(--u) * 2) calc(var(--u) * 2.6); border-radius: calc(var(--u) * 2.6);
    background: var(--lblbg); will-change: transform, opacity; }
  /* hoverable: a dotted underline and an info mark, a lift on hover */
  .lbl.notable { font-size: calc(var(--u) * 8.2); color: var(--ink); pointer-events: auto; cursor: pointer;
    transition: background .12s, box-shadow .12s; }
  .lbl.notable .nm { text-decoration: underline dotted var(--under); text-underline-offset: 2px; }
  .info { display: inline-block; width: 1.25em; height: 1.25em; line-height: 1.25em; margin-left: 0.3em;
    border-radius: 50%; background: var(--info); color: var(--ink2); font-size: 0.72em; font-weight: 700;
    text-align: center; vertical-align: 0.15em; font-style: normal; }
  .lbl.notable:hover, .lbl.notable.hot { background: var(--card); box-shadow: 0 0 0 1px var(--hair), 0 2px 8px var(--shadow1); }
  .lbl.notable:hover .info, .lbl.notable.hot .info { background: var(--ink2); color: var(--card); }
  #hint { position: absolute; left: 3.5%; top: calc(4.2% + var(--u) * 24); font-size: calc(var(--u) * 7.6);
    color: var(--muted); pointer-events: none; white-space: nowrap; }
  #hint .info { font-size: 0.9em; }
  #stacknav { position: absolute; right: 3%; top: 50%; transform: translateY(-50%); display: flex;
    flex-direction: column; gap: 6px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #stacknav.on { opacity: 1; pointer-events: auto; }
  #stacknav button { font: inherit; font-size: 12px; text-align: left; color: var(--muted); background: none;
    border: 0; border-left: 2px solid var(--hair); padding: 3px 0 3px 10px; cursor: pointer; }
  #stacknav button.on { color: var(--ink); border-left-color: var(--ink2); font-weight: 600; }
  #stacknav .steplist { display: flex; flex-direction: column; gap: 1px; }
  #stacknav button.head { font-weight: 600; color: var(--ink2); margin-top: 7px; font-size: 14px; }
  #stacknav button.head.on { color: var(--ink); }
  #stacknav button.sub { font-size: 13.5px; padding: 3px 0 3px 18px; }
  #stacknav button.sub.on { color: var(--ink); border-left-color: var(--ink2); font-weight: 600;
    background: linear-gradient(to right, var(--hl), transparent); }
  #stacknav .tip-s { font-size: 10.5px; color: var(--under); padding-left: 12px; margin-top: 4px; }
  #stacknav .steps { display: flex; gap: 4px; padding-left: 12px; margin-top: 6px; }
  #stacknav .steps button { border: 1px solid var(--hair); border-radius: 6px; padding: 3px 9px;
    color: var(--ink2); background: var(--glass); font-size: 12px; }
  #stacknav .steps button:hover:not(:disabled) { color: var(--ink); border-color: var(--under); }
  #stacknav .steps button:disabled { opacity: 0.35; cursor: default; }
  /* hover cards: a short delay to open, a dwell bar that pins the card so the
     pointer can move into it, and tabs and links inside once pinned */
  #tip { position: absolute; left: 0; top: 0; width: 300px; border-radius: 9px; background: var(--card);
    border: 1px solid var(--hair); box-shadow: 0 8px 28px var(--shadow2);
    font-size: 12.5px; line-height: 1.38; color: var(--ink2); pointer-events: none;
    opacity: 0; transition: opacity .12s; z-index: 5; overflow: hidden; }
  #tip.on { opacity: 1; }
  #tip.pinned { pointer-events: auto; }
  #tip .dwell { height: 2px; background: var(--ink2); width: 0; }
  #tip.on:not(.pinned) .dwell { width: 100%; transition: width var(--dwell, 600ms) linear; }
  #tip.pinned .dwell { width: 100%; background: var(--info); transition: none; }
  #tip .tabs { display: flex; flex-wrap: wrap; gap: 3px; padding: 8px 10px 0; }
  #tip .tabs button { font: inherit; font-size: 11.5px; color: var(--ink2); background: var(--chip);
    border: 0; border-radius: 10px; padding: 2px 8px; cursor: pointer; }
  #tip .tabs button.on { background: var(--ink2); color: var(--card); }
  #tip .body { padding: 9px 12px 10px; }
  #tip h4 { margin: 0; font-size: 14px; color: var(--ink); display: inline; }
  #tip .tag { margin-left: 6px; color: var(--muted); font-size: 12px; }
  #tip .org { margin: 3px 0 6px; font-size: 11.5px; color: var(--muted); font-style: italic; }
  #tip .chip { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px;
    background: var(--chipbg); color: var(--chipfg); margin: 0 3px 3px 0; }
  #tip ul { margin: 6px 0 0; padding: 0 0 0 15px; }
  #tip li { margin: 2px 0; }
  #tip li::marker { color: var(--under); }
  #tip .links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11.5px; }
  #tip .links a { white-space: nowrap; }
  #tip a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--linkline); }
  #tip a:hover { border-bottom-color: var(--link); }
  #tip .note-h { font-weight: 600; color: var(--ink); font-size: 13px; }
  #tip .fold-h { font-weight: 700; font-size: 14px; }
  #tip .stat { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px;
    background: var(--chip); color: var(--ink2); margin: 0 3px 3px 0; }
  #tip .mech { margin: 5px 0 2px; color: var(--ink); }
  #tip .def { margin: 6px 0 2px; padding: 6px 8px; border-radius: 6px; background: var(--card2); color: var(--ink2); }
  #tip .def b { color: var(--ink); }
  #tip.wide { width: 340px; }
  #tip .ecobar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 5px 0 3px; }
  #tip .ecobar i { display: block; height: 100%; }
  #tip .ecokey { display: flex; flex-wrap: wrap; gap: 1px 9px; font-size: 11px; }
  #tip .ecokey span { display: inline-flex; align-items: center; gap: 4px; }
  #tip .ecokey i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  #tip .sec { margin-top: 8px; font-weight: 600; color: var(--ink); font-size: 12px; }
  #tip ol.plants { margin: 4px 0 0; padding: 0 0 0 17px; }
  #tip ol.plants li { margin: 2px 0; }
  #tip ol.plants .n { color: var(--ink); font-weight: 600; }
  #tip ol.plants .w { color: var(--muted); }
  #tip ol.plants a { white-space: nowrap; }
  #tip .hint { padding: 0 12px 8px; font-size: 10.5px; color: var(--under); }
  #tip .hint { display: grid; }
  #tip .hint > span { grid-area: 1 / 1; transition: opacity .35s; }
  #tip.pinned .hint .pre, #tip:not(.pinned) .hint .post { opacity: 0; }
  #tip .seq { margin-top: 8px; font-size: 11.5px; }
  #tip .seq summary { cursor: pointer; color: var(--link); }
  #tip .seq pre { margin: 5px 0 0; max-height: 96px; overflow-y: auto; padding: 5px 7px;
    background: var(--card2); border-radius: 6px; font-size: 10.5px; line-height: 1.35;
    white-space: pre-wrap; word-break: break-all; user-select: all; }
  .card { position: absolute; left: 0; top: 0; text-align: center; pointer-events: none;
    will-change: transform, opacity; border-radius: 8px; padding: 4px 6px 5px; cursor: pointer;
    transition: background .12s, box-shadow .12s; }
  .card:hover, .card.hot { background: var(--card); box-shadow: 0 0 0 1px var(--hair), 0 2px 10px var(--shadow1); }
  .card:hover .info, .card.hot .info { background: var(--ink2); color: var(--card); }
  .card img { display: block; margin: 0 auto; }
  .card .fold { font-size: calc(var(--u) * 8.4); font-weight: 600; white-space: nowrap;
    margin-top: calc(var(--u) * 3); }
  .card .enz { font-size: calc(var(--u) * 7.4); color: var(--ink2); white-space: nowrap;
    margin-top: calc(var(--u) * 1); }
  .lbl.edge { font-size: calc(var(--u) * 9); color: var(--ink2); background: none; }
  .lbl.adj { font-size: calc(var(--u) * 9); font-weight: 600; }
  .lbl.adj.note { font-size: calc(var(--u) * 9.5); font-weight: 400; }
  .lbl.layer { font-size: calc(var(--u) * 10.5); font-weight: 600; background: none; text-align: right; }
  .lbl.layer small { display: block; font-size: 0.72em; font-weight: 400; color: var(--ink2); margin-top: 2px; }
  /* story mode: the caption is the point of the step, so it carries the weight
     and the panel title, the layer name and its tabs all step back behind it.
     .lead is the opening phrase of a line, in the PETadex red. */
  body.story .title { font-size: calc(var(--u) * 10.5); font-weight: 500; color: var(--ink2); }
  /* a taller text block needs a longer feather, or its right edge reads as a
     box sitting on the plane */
  body.story .lbl.layer { max-width: 470px; box-shadow: 30px 0 26px -12px var(--surface); }
  body.story .lbl.layer .ln { font-size: 0.66em; font-weight: 600; color: var(--ink2); letter-spacing: .02em; }
  body.story .annot-sw { margin-top: 5px; }
  body.story .annot-sw button { font-size: 11.5px; padding: 3px 9px; }
  body.story .lbl.layer small { font-size: 1.24em; font-weight: 500; color: var(--ink);
    line-height: 1.26; margin-top: 9px; }
  body.story .lbl.layer small .lead { color: var(--mark); font-weight: 700; }
  .lbl.layer small .nl { display: block; height: 1em; }
  /* the closing line, over all three layers at the overview. The per-layer
     captions are already compact-hidden there, so it has the column to itself */
  #osum { position: absolute; left: 0; top: 0; max-width: calc(var(--u) * 366); font-size: calc(var(--u) * 13);
    font-weight: 500; color: var(--ink); line-height: 1.26; pointer-events: none;
    opacity: 0; visibility: hidden; will-change: transform, opacity; }
  #osum .lead { color: var(--mark); font-weight: 700; }
  #osum .nl { display: block; height: 1em; }
  /* story mode runs its legend 30% down from the stacked panels' size: the
     caption is carrying the step, so the key only has to stay readable */
  body.story .lgbox { font-size: 12.6px; max-width: 221px; padding: 8px 11px 9px; }
  body.story .lgbox .lgh { font-size: 11.2px; margin-bottom: 4px; }
  body.story .lgbox .lg { font-size: 12.6px; gap: 3px; }
  body.story .lgbox .lg i { width: 8.4px; height: 8.4px; margin-top: 3.5px; }
  body.story .lgbox .lg i.ring { width: 6.3px; height: 6.3px; }
  .annot-sw { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; pointer-events: auto; max-width: 360px; }
  .annot-sw .vstep { padding: 4px 10px; }
  .annot-sw button:disabled { opacity: 0.35; cursor: default; }
  /* solid, and above the structure cards, so nothing shows through the text */
  .lbl.layer { max-width: 370px; white-space: normal; background: var(--surface); z-index: 2;
    padding: 6px 10px 8px 0; box-shadow: 10px 0 12px -6px var(--surface); }
  .lbl.layer.compact small { display: none; }
  /* site callouts on the Ecosystems view: a photo, the site, and the
     ecosystem of the legend it is an example of */
  .site { position: absolute; left: 0; top: 0; width: 204px; box-sizing: border-box; border-radius: 9px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--hair); box-shadow: 0 2px 10px var(--shadow1);
    font-size: 12px; line-height: 1.32; color: var(--ink2); pointer-events: auto; cursor: pointer;
    will-change: transform, opacity; z-index: 3; transition: background .12s, box-shadow .12s; }
  .site:hover, .site.hot { border-color: var(--ink2); background: var(--card); box-shadow: 0 4px 16px var(--shadow2); }
  .site:hover .info, .site.hot .info { background: var(--ink2); color: var(--card); }
  .site img { display: block; width: 100%; height: 80px; object-fit: cover; background: var(--info); }
  .site .txt { padding: 7px 10px 9px; border-top: 3px solid var(--eco, var(--hair)); }
  .site b { display: block; font-size: 14px; color: var(--ink); }
  .site b .nm { text-decoration: underline dotted var(--under); text-underline-offset: 2px; }
  .site .eco { display: flex; align-items: center; gap: 5px; margin: 2px 0 1px; font-size: 11.5px; color: var(--ink); }
  .site .eco i { width: 8px; height: 8px; border-radius: 50%; background: var(--eco); flex: none; }
  .site .hab { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  .site .spec { display: block; margin-top: 4px; color: var(--ink); }
  .site .def { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.28; }
  /* reference points on the temperature, pH and salinity surfaces: cards in
     the style of the site cards, with the value on a band of its colour where
     the photo would be */
  .envcard.dom .band b { font-size: 19px; }
  .envcard.dom { width: 178px; font-size: 11.5px; }
  .envcard.dom .ttl { font-size: 13px; }
  .envcard.dom .band { padding: 6px 10px 5px; min-height: 0; }
  .envcard.dom .pl { -webkit-line-clamp: 2; }
  .envcard { position: absolute; left: 0; top: 0; width: 196px; box-sizing: border-box; border-radius: 9px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--hair); box-shadow: 0 2px 10px var(--shadow1);
    font-size: 12px; line-height: 1.32; color: var(--ink2); pointer-events: auto; cursor: pointer;
    will-change: transform, opacity; z-index: 3; transition: background .12s, box-shadow .12s; }
  .envcard:hover, .envcard.hot { border-color: var(--ink2); background: var(--card); box-shadow: 0 4px 16px var(--shadow2); }
  .envcard:hover .info, .envcard.hot .info { background: var(--ink2); color: var(--card); }
  .envcard .band { display: flex; align-items: baseline; gap: 6px; padding: 9px 11px 8px; color: #fff;
    background: var(--band); min-height: 30px; }
  /* dark text on a light band, in either theme */
  .envcard .band.light { color: #0f172a; }
  .envcard .band b { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .envcard .band span { font-size: 11px; opacity: .9; }
  .envcard.region .band { background: repeating-linear-gradient(135deg, var(--band) 0 9px, color-mix(in srgb, var(--band) 80%, #fff) 9px 18px); }
  .envcard .txt { padding: 7px 10px 9px; }
  .envcard .ttl { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
  .envcard .ttl .nm { text-decoration: underline dotted var(--under); text-underline-offset: 2px; }
  .envcard .pl { display: block; color: var(--muted); font-size: 11.5px; margin: 1px 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .envcard .ln { display: block; color: var(--ink); }
  .envcard .sm { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  /* Cards on the landscape are a heading and a number. Eight or nine of them
     open at once, each with three or four lines of prose, buried the plane they
     are meant to annotate, so the detail lives in the hover card and the card
     itself keeps only what identifies it. The "i" chip says there is more. */
  .envcard .pl, .envcard .ln, .envcard .sm { display: none; }
  .site .hab, .site .def, .site .spec { display: none; }
  .envcard .txt { padding-bottom: 8px; }
  .site .txt { padding-bottom: 8px; }
  .cardlines { margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--hair); }
  .cardlines span { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  /* wiki copy: only the story panel exists, so its chrome is all that shows */
  #ctl, #stamp, #legend { display: none !important; }
  .title:not([data-t="7"]) { display: none !important; }
  body.cardmode #stage { pointer-events: none; }
  body.cardmode #stage > :not(#gl):not(#svg) { display: none !important; }
  .site-cap { position: absolute; left: 0; top: 0; font-size: 11px; color: var(--muted); font-style: italic;
    pointer-events: none; white-space: nowrap; opacity: 0; }
  .lbl.layer small { line-height: 1.35; }
  /* each layer's legend, in its own box to the right of that layer's plane */
  .lgbox { position: absolute; left: 0; top: 0; max-width: 315px; box-sizing: border-box; padding: 12px 16px 13px;
    border-radius: 9px; background: var(--card); border: 1px solid var(--hair); box-shadow: 0 2px 10px var(--shadow1);
    font-size: 18px; color: var(--ink2); pointer-events: none; z-index: 3; will-change: transform, opacity; }
  .lgbox .lgh { display: block; font-size: 16px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px; }
  .lgbox .lg { font-size: 18px; margin-top: 0; flex-direction: column; gap: 4px; }
  .lgbox .lg i { width: 12px; height: 12px; }
  .lgbox .lg i.ring { width: 9px; height: 9px; }
  .lgbox .lg span { gap: 6px; }
  .lgbox .lg span { white-space: normal; align-items: flex-start; line-height: 1.25; }
  .lgbox .lg i { flex: none; margin-top: 5px; }
  .lgbox .lg.ramp { display: grid; flex-direction: unset; width: 270px; gap: 6px 9px; }
  .lgbox .lg.ramp b { height: 11px; border-radius: 6px; }
  /* at the overview several legends share the side: back to the smaller size */
  .lgbox.small { font-size: 12px; max-width: 220px; padding: 8px 11px 9px; }
  .lgbox.small .lgh { font-size: 11px; margin-bottom: 4px; }
  .lgbox.small .lg { font-size: 12px; gap: 2px; }
  .lgbox.small .lg i { width: 8px; height: 8px; margin-top: 3px; }
  .lgbox.small .lg.ramp { width: 180px; }
  .lgbox.small .lg.ramp b { height: 7px; }
  .lgbox .lg.ramp span { white-space: normal; }
  .lg { display: flex; flex-wrap: wrap; gap: 2px 9px; margin-top: 4px; font-size: 0.68em; font-weight: 400;
    color: var(--ink2); }
  .lg span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .lg i.ring { background: none; border: 1px solid var(--under); width: 6px; height: 6px; }
  .lg.ramp { display: grid; grid-template-columns: 1fr 1fr; width: 220px; }
  .lg.ramp b { grid-column: 1 / 3; height: 7px; border-radius: 4px; outline: 0.8px solid var(--hair); }
  .lg.ramp span:last-child { justify-self: end; }
  .annot-sw button { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink2); background: var(--card);
    border: 1px solid var(--hair); border-radius: 14px; padding: 4px 12px; cursor: pointer; }
  .annot-sw button.on { background: var(--ink2); color: var(--card); border-color: var(--ink2); }

  .title { position: absolute; left: 3.5%; top: 4.2%; font-size: calc(var(--u) * 16);
    font-weight: 600; color: var(--ink); pointer-events: none; white-space: nowrap; }
  #stamp { position: absolute; left: 1.2%; bottom: 1.6%; right: 58%; font-size: calc(var(--u) * 7.4);
    color: var(--muted); pointer-events: none; }

  #legend { position: absolute; left: 86%; top: 33%; height: 34%; width: calc(var(--u) * 11);
    pointer-events: none; }
  #legend .bar { position: absolute; inset: 0; outline: 0.8px solid var(--hair); }
  #legend .bar.teal { background: linear-gradient(to bottom, #e3f7f5 0%, #bfeeea 17.7%, #93e0da 35.3%,
    #4ecdc4 53%, #2aa9a3 70.7%, #0d7f8c 88.3%, #07555f 106%); }
  #legend .bar.red { background: linear-gradient(to bottom, #fff1f1 0%, #ffdada 17.7%, #ffbdbd 35.3%,
    #ff9b9b 53%, #f3706e 70.7%, #d14343 88.3%, #942626 106%); }
  #legend .end { position: absolute; left: calc(100% + var(--u) * 6); font-size: calc(var(--u) * 8.5);

const GROUP_NOTES = {"IsPETase · LCC\nTfCut2 · Cut190":{"title":"Why these four share one point","points":["They are one atlas family (182, 535 members). The atlas draws a family once, at its representative: a Streptomyces cutinase domain.","Each matches that representative at 54 to 66% identity, and the others at 46 to 67%.","Same fold, same chemistry: bacterial cutinases with a Ser-His-Asp triad in a G-x-S-M-G motif. IsPETase's GWSMG, against GHSMG in the rest, is one of the few residues that set it apart.","Yet IsPETase works at mild temperatures and LCC and TfCut2 near 70 °C: close in sequence, apart in environment.","HiC, a fungal cutinase on the same chemistry, has no real alignment to them and sits in a family of its own."]}};

const STORY = {"1a":"<b class=\"lead\">Our story begins with</b> the set of all known plastic-degrading enzymes…","1b":"Few as they are, they are <b class=\"lead\">extremely diverse</b>. They have evolved to act on various kinds of plastic.","1c":"We use these known enzymes as landmarks and search outward for similar enzymes within public sequencing datasets.<span class=\"nl\"></span>We retrieved <b class=\"lead\">307M</b> enzymes from this search.","1d":"And the map they open spans that same breadth, across <b class=\"lead\">9 distinct CATH superfamilies</b> (structural folds).","2a":"Now that we have this big dataset of enzymes, we can <b class=\"lead\">annotate</b> each with various descriptive features.<span class=\"nl\"></span>Here, we can annotate for the place each enzyme comes from.","2b":"And the <i>temperature</i> it was living at.","2c":"And the pH.","2d":"or how salty the environment was.","2e":"And the <b class=\"lead\">machinery</b> it is built around.","2f":"And whatever else is bolted onto it.","3a":"Neighbours can tell you <b class=\"lead\">what an enzyme is</b>. An enzyme surrounded by marine enzymes is likely marine as well.","3b":"Measured activity reaches only 178 families of the 64,730 we have.","3c":"Past those, a model has stopped interpolating. This tells us where we understand enzymes well, and what is still <b class=\"lead\">unknown</b>.","overview":"Together, these three layers are the <b class=\"lead\">PetaBite Model</b>, from dataset generation to sequence annotation, and finally to predicting and interpreting the data. We&#x27;ve built this largest-of-its-kind planetary-scale enzyme discovery pipeline to find the right enzyme for every application."};

  const i = Math.floor(fy), j = Math.floor(fx), u = fx - j, v = fy - i, k = i * FIELD_N + j;
  return G[k] * (1 - u) * (1 - v) + G[k + 1] * u * (1 - v)

  const fromT = TH;

  + `<div class="steps"><button data-h="-1" title="Previous view (←)">‹ View</button>`
  + `<button data-h="1" title="Next view (→)">View ›</button></div>`
  + `<div class="steps" id="namerow"><button id="spinbtn" title="Turn the simulated volume"></button>`
  + `<button id="namebtn" title="The enzyme names crowd each other as the cloud turns"></button></div>`;
const nameRow = stackNav.querySelector("#namerow"), nameBtn = stackNav.querySelector("#namebtn");
const spinBtn = stackNav.querySelector("#spinbtn");
nameBtn.addEventListener("click", () => { cloudNames = !cloudNames; syncStackNav(); dirty = true; });
spinBtn.addEventListener("click", () => { spinOn = !spinOn; syncStackNav(); dirty = true; });

// One step per gesture. A trackpad keeps sending deltas for a second or more

const EMBEDDED = (() => { try { return window.self !== window.top; } catch { return true; } })();
stage.addEventListener("wheel", e => {

  if (!drag) return;
  view.taz = drag.az - (e.clientX - drag.x) * 0.3;
  view.tel = clip(drag.el + (e.clientY - drag.y) * 0.2, 4 - ELEV, 88 - ELEV);
});
const endDrag = () => { drag = null; stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("dblclick", resetView);

window.addEventListener("resize", resize);
resize();
if (document.fonts) document.fonts.ready.then(() => { measureLabels(); dirty = true; });
goTo(STORY_PANEL, true);
// wiki copy: #card is the overview card's picture, the Overview step alone,
// with no chrome and no input. It turns while the host says it is on screen
// ({ card: "play" } / { card: "pause" }), and never for reduced motion.
if (CARD) {
  document.body.classList.add("cardmode");
  goStep(STEPS.length - 1);
  stackF = stackFT;   // land on it rather than glide there
  spinOn = false;
  addEventListener("message", e => {
    if (e.origin !== location.origin || !e.data?.card) return;
    spinOn = e.data.card === "play" && !reduceMotion;
  });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
