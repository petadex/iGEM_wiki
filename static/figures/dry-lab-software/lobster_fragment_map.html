<meta charset="utf-8">
<title>LOBSTER Fragment Maps</title>
<style>
  /* Layout: two alignment tracks on a shared column axis, flanked by post-
     processing adapter caps; each fragment-position block drops a scrollable
     oligo-sequence panel on hover/focus. issue-114 brand. */
  :root{
    --surface:#e5d9cd;         /* page / element background */
    --panel:#efe7dc;           /* dropdown surface, a shade lighter */
    --ink:#5f3928;             /* all primary text */
    --ink-soft:#8a6b55;        /* secondary text */
    --grid:#c9b69d;            /* axis, hairlines, pill borders */
    --border:#ac7f56;          /* frame around the element */
    --brick:#ac493d;           /* emphasis + degenerate bases */
    --gut:98px;                /* side gutter reserved for the adapter caps */
    --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono","Cascadia Code",Consolas,"Liberation Mono",Menlo,monospace;
    color-scheme:light;
  }
  .lob{
    background:var(--surface); color:var(--ink);
    border:4px solid var(--border);
    font-family:var(--sans);
    max-width:1180px; margin:0 auto;
    padding:16px clamp(16px,4vw,40px) 20px;
    box-sizing:border-box; position:relative;
  }
  .lob *{box-sizing:border-box;}
  .lob .logo{position:absolute; top:4px; right:16px; width:78px; height:auto;
    pointer-events:none; user-select:none;}
  .lob .track{position:relative; margin:4px 0;}
  .lob .track + .track{margin-top:34px;}
  .lob .track-head{display:flex; align-items:baseline; gap:14px;
    flex-wrap:wrap; margin-bottom:6px;}
  .lob .cl-name{font-size:25px; font-weight:800; letter-spacing:.01em;
    color:var(--ink);}
  .lob .cl-k{font-size:16px; font-weight:600; color:var(--ink-soft);
    letter-spacing:.02em;}

  .lob .lane{position:relative; height:62px; margin-top:46px;}
  .lob .frag-lane{position:absolute; top:0; height:62px;
    left:var(--gut); right:var(--gut);}
  .lob .frag-group{position:absolute; top:0; height:62px;}
  .lob .frag{
    position:absolute; inset:0; border:1.5px solid var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; outline:none;
    transition:filter .12s ease;
  }
  .lob .frag:hover,.lob .frag:focus-visible{filter:brightness(1.06);}
  .lob .frag-id{font-size:16px; font-weight:800; line-height:1.05;}
  .lob .frag-n{font-size:12px; font-weight:600; opacity:.92; line-height:1.3;}
  .lob .tick{position:absolute; top:0; width:2px; height:11px;
    transform:translateX(-1px);}           /* degenerate-column mark */

  .lob .cut{position:absolute; top:-7px; height:76px; width:0;
    border-left:2px dashed var(--ink-soft); transform:translateX(-1px);}
  .lob .overhang{position:absolute; left:50%; top:-30px; transform:translateX(-50%);
    font-family:var(--mono); font-size:13px; color:var(--ink);
    background:var(--surface); border:1px solid var(--grid); border-radius:5px;
    padding:2px 6px; white-space:nowrap;}

  /* post-processing adapter caps in the gutters */
  .lob .cap{position:absolute; top:0; height:62px; width:var(--gut);
    border:1.5px solid var(--ink-soft); border-radius:0; background:var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:4px 6px; cursor:help; outline:none;}
  .lob .cap-lab{font-size:9px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-soft); text-align:center;}
  .lob .cap-seq{font-family:var(--mono); font-size:9px; line-height:1.35;
    color:var(--ink); word-break:break-all; text-align:center;}

  /* dropdown shared by fragment blocks and adapter caps */
  .lob .dropdown{
    position:absolute; top:calc(100% - 2px); left:0;
    width:min(430px,86vw); max-height:272px; overflow-y:auto;
    background:var(--panel); border:1.5px solid var(--border); border-radius:8px;
    box-shadow:0 10px 26px rgba(63,41,25,.26);
    padding:10px 12px; display:none; z-index:70;
  }
  .lob .dropdown.right{left:auto; right:0;}
  .lob .frag-group:hover,.lob .cap:hover{z-index:60;}
  .lob .frag-group:hover .dropdown, .lob .frag-group:focus-within .dropdown,
  .lob .cap:hover .dropdown, .lob .cap:focus-within .dropdown{display:block;}
  .lob .dd-head{font-size:12px; font-weight:700; color:var(--ink);
    letter-spacing:.02em; padding-bottom:7px; margin-bottom:8px;
    border-bottom:1px solid var(--grid); position:sticky; top:-10px;
    background:var(--panel);}
  .lob .oligo{padding:6px 0; border-top:1px solid rgba(201,182,157,.5);}
  .lob .oligo:first-of-type{border-top:none;}
  .lob .o-meta{font-size:10.5px; color:var(--ink-soft); margin-bottom:2px;
    font-variant-numeric:tabular-nums;}
  .lob .o-seq{font-family:var(--mono); font-size:11px; line-height:1.5;
    color:var(--ink); word-break:break-all;}
  .lob .adapter-detail{font-size:11px; color:var(--ink-soft); margin-top:8px;
    line-height:1.45;}
  .lob .degbase{color:var(--brick); font-weight:700;}

  .lob .axis{position:relative; height:18px; margin:12px var(--gut) 0;
    border-top:1.4px solid var(--grid);}
  .lob .atick{position:absolute; top:0; transform:translateX(-50%);
    font-size:10.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .lob .atick::before{content:""; position:absolute; left:50%; top:-7px; height:6px;
    border-left:1px solid var(--grid);}
  .lob .axis-label{text-align:center; font-size:12px; color:var(--ink-soft);
    margin-top:3px; letter-spacing:.02em;}
  .lob .hint{font-size:13px; color:var(--ink); margin-top:20px;
    text-align:left; letter-spacing:.01em; line-height:1.65;}
  .lob .dropdown::-webkit-scrollbar{width:9px;}
  .lob .dropdown::-webkit-scrollbar-thumb{background:var(--grid); border-radius:5px;}
  @media (max-width:620px){ :root{--gut:62px;} .lob .cap-seq{font-size:8px;}
    .lob .logo{width:54px; top:4px; right:10px;} }
</style>

const PALETTE = ["#5e689e","#72a09c","#679a79","#cba945","#7b5f9d","#9d5e91"];

// text/tick colour that reads on a given block colour (relative luminance)
function onColor(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255,
        b=parseInt(hex.slice(5,7),16)/255;
  const lin=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  const L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return L>0.5 ? "#3d2418" : "#fbf6ef";
}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hlSeq=s=>esc(s).replace(/[^ACGT]/g,m=>'<span class="degbase">'+m+'</span>');
function el(tag,cls){const e=document.createElement(tag); if(cls)e.className=cls; return e;}

function makeCap(side,end,adapter){
  const cap=el("div","cap "+side);
  cap.tabIndex=0;
  cap.setAttribute("aria-label","post-processing adapter, "+end+" end");
  cap.innerHTML='<div class="cap-lab">'+end+' adapter</div>'+
                '<div class="cap-seq">'+hlSeq(adapter.seq)+'</div>';
  const dd=el("div","dropdown"+(side==="right"?" right":""));
  dd.innerHTML='<div class="dd-head">Post-processing adapter ('+end+')</div>'+
    '<div class="oligo"><div class="o-meta">added to the '+end+
    ' end  ·  '+adapter.seq.length+' nt</div>'+
    '<div class="o-seq">'+hlSeq(adapter.seq)+'</div></div>'+
    '<div class="adapter-detail">'+esc(adapter.detail)+'</div>';
  cap.appendChild(dd);
  return cap;
}

function appendAxis(parent,W){
  const axis=el("div","axis");
  for(let c=0;c<=W-4;c+=25){
    const t=el("div","atick"); t.style.left=(c/W*100)+"%"; t.textContent=c;
    axis.appendChild(t);
  }
  parent.appendChild(axis);
  const al=el("div","axis-label"); al.textContent="alignment column";
  parent.appendChild(al);
}

function render(){
  const root=document.getElementById("lob");
  const W=DATA.width;
  DATA.clusters.forEach(cl=>{
    const track=el("div","track");
    const head=el("div","track-head");
    head.innerHTML='<span class="cl-name">'+esc(cl.label)+'</span>'+
      '<span class="cl-k"># of Fragment Positions (K) = '+cl.K+'</span>';
    track.appendChild(head);

    const lane=el("div","lane");
    const flane=el("div","frag-lane");
    cl.fragments.forEach((fr,i)=>{
      const col=PALETTE[i%PALETTE.length], fg=onColor(col);
      const g=el("div","frag-group");
      g.style.left=(fr.start/W*100)+"%";
      g.style.width=((fr.end-fr.start+1)/W*100)+"%";

      const block=el("div","frag");
      block.style.background=col; block.style.color=fg;
      block.tabIndex=0;
      block.setAttribute("aria-label",
        cl.label+" fragment position "+fr.idx+", "+fr.n_oligos+" oligos");
      block.innerHTML='<span class="frag-id">FP'+fr.idx+'</span>'+
                      '<span class="frag-n">×'+fr.n_oligos+'</span>';
      fr.deg_cols.forEach(dc=>{
        const t=el("div","tick");
        t.style.left=((dc+0.5)/fr.span*100)+"%";
        t.style.background=fg;
        block.appendChild(t);
      });
      g.appendChild(block);

      const dd=el("div","dropdown");
      const center=(fr.start+(fr.end-fr.start+1)/2)/W;
      if(center>0.55) dd.classList.add("right");
      let html='<div class="dd-head">Fragment Position '+fr.idx+
        '  ·  columns '+fr.start+'–'+fr.end+
        '  ·  '+fr.n_oligos+(fr.n_oligos===1?' oligo':' oligos')+'</div>';
      fr.oligos.forEach((o,j)=>{
        const v=o.variants>1?o.variants+" variants":"1 variant";
        html+='<div class="oligo"><div class="o-meta">#'+(j+1)+
          '  ·  '+o.nt+' nt  ·  '+v+
          '</div><div class="o-seq">'+hlSeq(o.seq)+'</div></div>';
      });
      dd.innerHTML=html;
      g.appendChild(dd);
      flane.appendChild(g);
    });

    cl.cuts.forEach((c,ci)=>{
      const cut=el("div","cut"); cut.style.left=(c/W*100)+"%";
      const pill=el("div","overhang"); pill.textContent=cl.overhangs[ci]||"";
      cut.appendChild(pill); flane.appendChild(cut);
    });
    lane.appendChild(flane);

    if(cl.adapters){
      const lastEnd=cl.fragments[cl.fragments.length-1].end;
      const capL=makeCap("left","5′",cl.adapters.left);
      capL.style.right="100%";                      // flush to the 5' sequence end
      const capR=makeCap("right","3′",cl.adapters.right);
      capR.style.left=((lastEnd+1)/W*100)+"%";       // flush to the 3' sequence end
      flane.appendChild(capL); flane.appendChild(capR);
    }
    track.appendChild(lane);
    appendAxis(track, W);     // number line + caption under every track
    root.appendChild(track);
  });

  const hint=el("div","hint");
  hint.innerHTML="Hover or tap a fragment position for its oligo sequences  ·  "+
    "ticks mark degenerate (variable) columns  ·  "+
    "4-nt labels at the dashed cuts are the Golden Gate (BsmBI) overhangs<br>"+
    "end caps are the post-processing adapter sequences";
  root.appendChild(hint);
}
render();
</script>
