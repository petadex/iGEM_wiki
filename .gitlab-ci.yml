image: node:20.19.0

stages:
  - install
  - deploy

variables:
  GATSBY_TELEMETRY_DISABLED: "1"
  GATSBY_PATH_PREFIX: "/toronto"
  XDG_CONFIG_HOME: "$CI_PROJECT_DIR/.config"

install_dependencies:
  stage: install
  script:
    - npm ci --no-audit --no-fund
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

pages:
  stage: deploy
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - npm run build:igem
    - node scripts/trim-pages-artifact.mjs
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
